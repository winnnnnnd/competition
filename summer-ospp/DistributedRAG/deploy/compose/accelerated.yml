x-rag-environment: &rag-environment
  RAG_PROFILE: ${RAG_PROFILE:-accelerated}
  RAY_ADDRESS: ray://ray-head:10001
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag-local}@postgres:5432/${POSTGRES_DB:-distributed_rag}
  MINIO_HOST: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
  MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-rag-documents}
  MILVUS_HOST: standalone
  MILVUS_PORT: "19530"
  MILVUS_COLLECTION: ${MILVUS_COLLECTION:-distributed_rag_chunks}
  EMBEDDING_BACKEND: qwen_mindspore
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-/app/.mindnlp/model/Qwen3-Embedding}
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
  RERANKER_BACKEND: qwen_mindspore
  RERANKER_MODEL: ${RERANKER_MODEL:-/app/.mindnlp/model/Qwen3-Reranker}
  LLM_BACKEND: qwen_mindspore
  LLM_MODEL: ${LLM_MODEL:-/app/.mindnlp/model/Qwen2_5-1_5B-Instruct}
  RAY_MODEL_GPUS: ${RAY_MODEL_GPUS:-0.25}
  RAY_MODEL_NPUS: ${RAY_MODEL_NPUS:-0}
  PYTHONPATH: /app/src
  CONDA_ENV_NAME: ms

x-rag-build: &rag-build
  context: ../..
  dockerfile: deploy/docker/Dockerfile
  args:
    BASE_IMAGE: ${ACCELERATED_BASE_IMAGE:-hooyu/ms:latest}
    CONDA_ENV_NAME: ms

services:
  ray-head:
    build: *rag-build
    ports:
      - "8265:8265"
      - "10001:10001"
    shm_size: 8gb
    environment:
      PYTHONPATH: /app/src
      CONDA_ENV_NAME: ms
    command: ray start --head --port=6379 --ray-client-server-port=10001 --dashboard-host=0.0.0.0 --num-cpus=${RAY_HEAD_CPUS:-2} --block
    networks: [rag_net]
    volumes:
      - ../../rag_models_cache:/app/.mindnlp/model

  ray-worker:
    build: *rag-build
    depends_on: [ray-head]
    shm_size: 16gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-1}
              capabilities: [gpu]
    environment:
      RAY_HEAD_ADDRESS: ray-head:6379
      RAY_WORKER_CPUS: ${RAY_WORKER_CPUS:-8}
      RAY_WORKER_GPUS: ${GPU_COUNT:-1}
      RAY_CUSTOM_RESOURCES: ${RAY_CUSTOM_RESOURCES:-}
      NVIDIA_VISIBLE_DEVICES: all
      PYTHONPATH: /app/src
      CONDA_ENV_NAME: ms
    command: /app/scripts/start_ray_worker.sh
    networks: [rag_net]
    volumes:
      - ../../rag_models_cache:/app/.mindnlp/model

  web:
    build: *rag-build
    ports:
      - "7860:7860"
    environment: *rag-environment
    depends_on:
      postgres: {condition: service_healthy}
      standalone: {condition: service_healthy}
      minio: {condition: service_healthy}
      ray-head: {condition: service_started}
    command: streamlit run apps/streamlit_app.py --server.port=7860 --server.address=0.0.0.0 --server.enableCORS=false
    networks: [rag_net]
    volumes:
      - ../../rag_models_cache:/app/.mindnlp/model

  api:
    build: *rag-build
    ports:
      - "8000:8000"
    environment: *rag-environment
    depends_on:
      postgres: {condition: service_healthy}
      standalone: {condition: service_healthy}
      minio: {condition: service_healthy}
      ray-head: {condition: service_started}
    command: uvicorn distributed_rag.interfaces.api:create_app --factory --host 0.0.0.0 --port 8000
    networks: [rag_net]
    volumes:
      - ../../rag_models_cache:/app/.mindnlp/model

  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag-local}
      POSTGRES_DB: ${POSTGRES_DB:-distributed_rag}
    volumes:
      - ../../volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [rag_net]

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - ../../volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [rag_net]

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ../../volumes/minio:/data
    command: minio server /data --console-address :9001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [rag_net]

  standalone:
    image: milvusdb/milvus:v2.4.1
    command: ["milvus", "run", "standalone"]
    security_opt: ["seccomp:unconfined"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - ../../volumes/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      start_period: 60s
      timeout: 5s
      retries: 20
    networks: [rag_net]

networks:
  rag_net:
    name: rag_net
    driver: bridge
